name: release-apk
on:
  workflow_dispatch:
    inputs:
      pwa_url: { description: 'HTTPS URL root PWA, e.g. https://user.github.io', required: true, type: string }
      release_tag: { description: 'Release tag', required: true, default: 'v1.3.0', type: string }
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli
      - name: Initialize TWA project
        run: bubblewrap init --manifest "${{ inputs.pwa_url }}/manifest.webmanifest" --directory .twa --name C_Ziperr --shortName C_Ziperr --startUrl "${{ inputs.pwa_url }}/"
      - name: Build APK
        working-directory: .twa
        run: bubblewrap build --skipPwaValidation
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: C_Ziperr-${{ inputs.release_tag }}
          path: |
            .twa/app-release-signed.apk
            .twa/app-release-unsigned.apk
            .twa/*.aab
          if-no-files-found: warn
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: true
          files: |
            .twa/app-release-signed.apk
            .twa/*.aab
