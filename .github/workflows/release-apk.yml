name: release-apk
on:
  workflow_dispatch:
    inputs:
      pwa_url: { description: 'HTTPS URL root PWA, e.g. https://user.github.io', required: true, type: string }
      release_tag: { description: 'Release tag', required: true, default: 'v1.3.0', type: string }
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli
      - name: Configure Bubblewrap toolchain
        run: |
          test -n "$ANDROID_HOME"
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
      - name: Initialize TWA project
        run: |
          mkdir -p .twa
          sudo apt-get update -qq
          sudo apt-get install -y -qq expect
          KEY_PASSWORD="$(openssl rand -hex 24)"
          export KEY_PASSWORD
          expect <<'EOF'
          set timeout 300
          spawn bubblewrap init --manifest "${{ inputs.pwa_url }}/manifest.webmanifest" --directory .twa --name C_Ziperr --shortName C_Ziperr --startUrl "${{ inputs.pwa_url }}/"
          expect "Domain:" { send "v1-byte.github.io\r" }
          expect "URL path:" { send "/\r" }
          expect "Application name:" { send "C_Ziperr\r" }
          expect "Short name:" { send "C_Ziperr\r" }
          expect "Application ID:" { send "com.v1byte.cziperr\r" }
          expect "Starting version code:" { send "1\r" }
          expect "Display mode:" { send "\r" }
          expect "Orientation:" { send "\r" }
          expect "Status bar color:" { send "#0f1115\r" }
          expect "Splash screen color:" { send "#0f1115\r" }
          expect "Icon URL:" { send "https://v1-byte.github.io/C_Ziperr/icon-512.png\r" }
          expect "Maskable icon URL:" { send "\r" }
          expect {
            "Include app shortcuts?" { send "n\r"; exp_continue }
            "Monochrome icon URL:" { send "\r" }
          }
          expect "Include support for Play Billing?" { send "n\r" }
          expect "Request geolocation permission?" { send "n\r" }
          expect "Key store location:" { send "\r" }
          expect "Key name:" { send "\r" }
          expect "Do you want to create one now?" { send "y\r" }
          expect "First and Last names" { send "C_Ziperr Release\r" }
          expect "Organizational Unit" { send "Engineering\r" }
          expect "Organization" { send "C_Ziperr\r" }
          expect "Country" { send "US\r" }
          expect "Password for the Key Store:" { send "$env(KEY_PASSWORD)\r" }
          expect "Password for the Key:" { send "$env(KEY_PASSWORD)\r" }
          expect eof
          EOF
      - name: Build APK
        working-directory: .twa
        run: bubblewrap build --skipPwaValidation
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: C_Ziperr-${{ inputs.release_tag }}
          path: |
            .twa/app-release-signed.apk
            .twa/app-release-unsigned.apk
            .twa/*.aab
          if-no-files-found: warn
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: true
          files: |
            .twa/app-release-signed.apk
            .twa/*.aab
