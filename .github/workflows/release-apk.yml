name: release-apk
on:
  workflow_dispatch:
    inputs:
      pwa_url: { description: 'HTTPS URL root PWA, e.g. https://user.github.io', required: true, type: string }
      release_tag: { description: 'Release tag', required: true, default: 'v1.3.0', type: string }
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli
      - name: Configure Bubblewrap toolchain
        run: |
          test -n "$ANDROID_HOME"
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > "$HOME/.bubblewrap/config.json"
      - name: Initialize TWA project
        run: |
          mkdir -p .twa
          KEY_PASSWORD="$(openssl rand -hex 24)"
          {
            printf '%s\n' '' '' '' '' '' '' '' '' '' '' '' '' '' 'n' 'n' '' '' 'y' 'C_Ziperr Release' 'Engineering' 'C_Ziperr' 'US'
            printf '%s\n' "$KEY_PASSWORD" "$KEY_PASSWORD"
          } | bubblewrap init --manifest "${{ inputs.pwa_url }}/manifest.webmanifest" --directory .twa --name C_Ziperr --shortName C_Ziperr --startUrl "${{ inputs.pwa_url }}/"
      - name: Build APK
        working-directory: .twa
        run: bubblewrap build --skipPwaValidation
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: C_Ziperr-${{ inputs.release_tag }}
          path: |
            .twa/app-release-signed.apk
            .twa/app-release-unsigned.apk
            .twa/*.aab
          if-no-files-found: warn
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: true
          files: |
            .twa/app-release-signed.apk
            .twa/*.aab
