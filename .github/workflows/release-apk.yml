name: release-apk
on:
  workflow_dispatch:
    inputs:
      pwa_url: { description: 'HTTPS URL root PWA', required: true, default: 'https://v1-byte.github.io/C_Ziperr/', type: string }
      release_tag: { description: 'Release tag', required: true, default: 'v1.3.6', type: string }
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Install Bubblewrap
        run: npm install --global @bubblewrap/cli
      - name: Configure Bubblewrap toolchain
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          test -n "$SDK_ROOT"
          if [ -x "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" ] && [ ! -x "$SDK_ROOT/bin/sdkmanager" ]; then
            rm -rf "$SDK_ROOT/bin"
            ln -s "$SDK_ROOT/cmdline-tools/latest/bin" "$SDK_ROOT/bin"
          fi
          test -x "$SDK_ROOT/bin/sdkmanager"
          mkdir -p "$HOME/.bubblewrap"
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}\n' "$JAVA_HOME" "$SDK_ROOT" > "$HOME/.bubblewrap/config.json"
      - name: Initialize TWA project
        run: |
          mkdir -p twa
          PWA_URL="${{ inputs.pwa_url }}"
          PWA_HOST="${PWA_URL#https://}"
          PWA_HOST="${PWA_HOST%%/*}"
          PWA_PATH="${PWA_URL#https://$PWA_HOST}"
          [ -n "$PWA_PATH" ] || PWA_PATH="/"
          case "$PWA_PATH" in */) ;; *) PWA_PATH="$PWA_PATH/" ;; esac
          KEY_PASSWORD="$(openssl rand -hex 24)"
          printf '%s\n' "$KEY_PASSWORD" > twa/.key-password
          "$JAVA_HOME/bin/keytool" -genkeypair -keystore twa/android.keystore -storepass "$KEY_PASSWORD" -keypass "$KEY_PASSWORD" -alias android -keyalg RSA -keysize 2048 -validity 10000 -dname 'CN=C_Ziperr Release, OU=Engineering, O=C_Ziperr, C=US'
          cat > twa/twa-manifest.json <<EOF
          {
            "packageId": "com.v1byte.cziperr",
            "host": "${PWA_HOST}",
            "name": "C_Ziperr",
            "launcherName": "C_Ziperr",
            "display": "standalone",
            "themeColor": "#0f1115",
            "themeColorDark": "#0f1115",
            "navigationColor": "#0f1115",
            "navigationColorDark": "#0f1115",
            "navigationDividerColor": "#0f1115",
            "navigationDividerColorDark": "#0f1115",
            "backgroundColor": "#0f1115",
            "enableNotifications": true,
            "enableSiteSettingsShortcut": true,
            "startUrl": "${PWA_PATH}",
            "iconUrl": "${PWA_URL}/icon-512.png",
            "splashScreenFadeOutDuration": 300,
            "signingKey": { "path": "./android.keystore", "alias": "android" },
            "appVersion": "1.3.6",
            "appVersionCode": 6,
            "generatorApp": "bubblewrap-cli",
            "webManifestUrl": "${PWA_URL}/manifest.webmanifest",
            "shortcuts": []
          }
          EOF
          (cd twa && bubblewrap update --skipVersionUpgrade --manifest ./twa-manifest.json)
      - name: Build APK
        working-directory: twa
        run: |
          export BUBBLEWRAP_KEYSTORE_PASSWORD="$(cat .key-password)"
          export BUBBLEWRAP_KEY_PASSWORD="$BUBBLEWRAP_KEYSTORE_PASSWORD"
          bubblewrap build --skipPwaValidation --manifest ./twa-manifest.json
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: C_Ziperr-${{ inputs.release_tag }}
          path: |
            twa/app-release-signed.apk
            twa/app-release-unsigned.apk
            twa/*.aab
          if-no-files-found: warn
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          generate_release_notes: true
          files: |
            twa/app-release-signed.apk
            twa/*.aab
