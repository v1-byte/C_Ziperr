name: collect-production
run-name: collect ${{ github.event.client_payload.tag }}
'on': [repository_dispatch]

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-v1
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/collect.mjs
        env:
          GAME_URL: ${{ github.event.client_payload.game_url }}
          OUT: out/${{ github.event.client_payload.folder || 'game-1' }}
          PLAY_SECONDS: ${{ github.event.client_payload.play_seconds || '90' }}
          SPINS: ${{ github.event.client_payload.spins || '30' }}
          SPIN_X: ${{ github.event.client_payload.spin_x || '' }}
          SPIN_Y: ${{ github.event.client_payload.spin_y || '' }}
          HAR: ${{ github.event.client_payload.har || '0' }}
          CRAWL: ${{ github.event.client_payload.crawl || '1' }}
          CRAWL_MAX: ${{ github.event.client_payload.crawl_max || '400' }}
          COOKIES: ${{ secrets.COLLECT_COOKIES }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          if-no-files-found: ignore
          name: ${{ github.event.client_payload.folder || 'game-1' }}
          path: out/${{ github.event.client_payload.folder || 'game-1' }}
          retention-days: 30
