name: Game Resource Collector
run-name: C.Ziperr Collect ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      url:
        description: "URL game yang ingin di-capture"
        required: true
        type: string
      request_id:
        description: "ID internal untuk menghubungkan permintaan collect dengan run"
        required: false
        type: string
      wait_seconds:
        description: "Waktu tunggu setelah load (detik) — offline-first 20–25"
        required: false
        default: "22"
        type: string
      auto_spins:
        description: "Auto-spin (offline-first default 6, session/spin snapshot)"
        required: false
        default: "6"
        type: string
      auto_history:
        description: "Buka History sekali (1=ya, 0=tidak)"
        required: false
        default: "1"
        type: string
      spin_delay_ms:
        description: "Delay antar spin (ms) untuk settle animasi/network"
        required: false
        default: "2200"
        type: string
      seed_zip:
        description: "Path ZIP seed di repo (opsional, mis. seeds/mahjong.zip)"
        required: false
        default: ""
        type: string
      mock_offline:
        description: "Siapkan mock offline dan replay API"
        required: false
        default: "1"
        type: string

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install Node deps + Playwright browser
        run: |
          npm ci
          npx playwright install chromium --with-deps
      - name: Capture game (HTML/JS/CSS/assets → ZIP)
        env:
          TARGET_URL: ${{ github.event.inputs.url }}
          WAIT_SECONDS: ${{ github.event.inputs.wait_seconds }}
          AUTO_SPINS: ${{ github.event.inputs.auto_spins }}
          AUTO_HISTORY: ${{ github.event.inputs.auto_history }}
          SPIN_DELAY_MS: ${{ github.event.inputs.spin_delay_ms }}
          SEED_ZIP: ${{ github.event.inputs.seed_zip }}
          MOCK_OFFLINE: ${{ github.event.inputs.mock_offline }}
        run: node scripts/collect.js
      - name: Upload ZIP artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-resources
          path: output/*.zip
          retention-days: 5
      - name: Summary
        run: |
          echo "### Capture Selesai" >> $GITHUB_STEP_SUMMARY
          echo "Target URL dicatat di manifest artifact (nilai query sensitif disamarkan)." >> $GITHUB_STEP_SUMMARY
          echo "Auto spins: ${{ github.event.inputs.auto_spins }} · History: ${{ github.event.inputs.auto_history }}" >> $GITHUB_STEP_SUMMARY
          echo "Download ZIP di bagian Artifacts." >> $GITHUB_STEP_SUMMARY
