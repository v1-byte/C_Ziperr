name: collect-smoke
'on': [workflow_dispatch]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node tools/collect.mjs
        env:
          GAME_URL: https://game-resource-collector.technologiesfrostbyte.workers.dev/
          OUT: out/smoke-test
          PLAY_SECONDS: "15"
          SPINS: "0"
          HAR: "1"
          CRAWL: "1"
          CRAWL_MAX: "100"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-test
          path: out/smoke-test
          if-no-files-found: ignore
          retention-days: 7
